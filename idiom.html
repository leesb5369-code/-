  { hanja: "表裏不同", hangul: "표리부동", meaning: "겉으로 드러난 모습과 속마음이 다름.", keywords: ["위선", "이중성", "거짓"] },
  { hanja: "風前燈火", hangul: "풍전등화", meaning: "바람 앞의 등불처럼 매우 위태로운 처지.", keywords: ["위기", "위태로움", "불안"] },
  { hanja: "鶴首苦待", hangul: "학수고대", meaning: "학처럼 목을 길게 빼고 몹시 기다림.", keywords: ["기다림", "간절함", "설렘"] },
  { hanja: "咸興差使", hangul: "함흥차사", meaning: "심부름을 가서 소식이 없거나 돌아오지 않음.", keywords: ["소식없음", "답답함", "무소식"] },
  { hanja: "孑孑單身", hangul: "혈혈단신", meaning: "의지할 곳 없이 외로운 홀몸.", keywords: ["외로움", "고독", "혼자", "홀몸"] },
  { hanja: "螢雪之功", hangul: "형설지공", meaning: "반딧불과 눈빛으로 글을 읽어가며 고생 속에서 공부하여 이룬 결실.", keywords: ["노력", "학업", "고생"] },
  { hanja: "狐假虎威", hangul: "호가호위", meaning: "여우가 호랑이의 위세를 빌려 뽐낸다는 뜻으로, 남의 권세를 빌려 허세를 부림.", keywords: ["권세", "허세", "빌린힘"] },
  { hanja: "畵龍點睛", hangul: "화룡점정", meaning: "용을 그린 뒤 마지막으로 눈동자를 찍는다는 뜻으로, 가장 중요한 부분을 완성해 일을 끝맺음.", keywords: ["완성", "마무리", "화룡점정"] },
  { hanja: "換骨奪胎", hangul: "환골탈태", meaning: "뼈와 태를 바꾼 듯 몰라보게 달라짐.", keywords: ["변화", "발전", "탈바꿈"] },
  { hanja: "會者定離", hangul: "회자정리", meaning: "만난 사람은 반드시 헤어지게 되어 있음.", keywords: ["이별", "인연", "만남"] },
  { hanja: "厚顔無恥", hangul: "후안무치", meaning: "낯가죽이 두꺼워 부끄러움을 모름.", keywords: ["뻔뻔함", "몰염치", "부끄러움없음"] },
  { hanja: "興盡悲來", hangul: "흥진비래", meaning: "즐거운 일이 다하면 슬픈 일이 옴.", keywords: ["인생무상", "화복", "허무함"] }
];

const POPULAR = ["고진감래", "새옹지마", "전화위복", "일석이조", "우공이산", "온고지신", "죽마고우", "형설지공"];
const CHIP_WORDS = ["노력", "우정", "사랑", "위기", "성공", "인내", "효도", "배움", "걱정", "이별", "겸손", "기다림", "외로움"];

const chipsEl = document.getElementById("chips");
CHIP_WORDS.forEach(word => {
  const btn = document.createElement("button");
  btn.className = "chip";
  btn.textContent = word;
  btn.onclick = () => {
    document.getElementById("query").value = word;
    runSearch();
  };
  chipsEl.appendChild(btn);
});

function scoreIdiom(idiom, query, tokens) {
  let score = 0;
  const matched = [];

  if (query && (idiom.hangul.includes(query) || idiom.hanja.includes(query))) {
    score += 10;
  }

  idiom.keywords.forEach(keyword => {
    let hit = false;
    if (query && query.includes(keyword)) hit = true;
    tokens.forEach(token => {
      if (token.length >= 2 && (keyword.includes(token) || token.includes(keyword))) hit = true;
    });
    if (hit) {
      score += 3;
      matched.push(keyword);
    }
  });

  tokens.forEach(token => {
    if (token.length >= 2 && idiom.meaning.includes(token)) score += 1;
  });

  return { score, matched };
}

function renderCards(list, highlightMap) {
  const resultsEl = document.getElementById("results");
  resultsEl.innerHTML = "";

  if (list.length === 0) {
    resultsEl.innerHTML = '<div class="empty">일치하는 사자성어를 찾지 못했어요. 다른 키워드로 시도해보세요.</div>';
    return;
  }

  list.forEach(idiom => {
    const matched = highlightMap ? (highlightMap.get(idiom) || []) : [];
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="hanja">${idiom.hanja}</div>
      <div class="hangul">${idiom.hangul}</div>
      <div class="meaning">${idiom.meaning}</div>
      <div class="tags">
        ${idiom.keywords.map(k => `<span class="tag${matched.includes(k) ? " matched" : ""}">${k}</span>`).join("")}
      </div>
    `;
    resultsEl.appendChild(card);
  });
}

function showDefault() {
  const list = IDIOMS.filter(i => POPULAR.includes(i.hangul));
  document.getElementById("status").textContent = `인기 사자성어 ${list.length}개`;
  renderCards(list, null);
}

function runSearch() {
  const query = document.getElementById("query").value.trim();
  const statusEl = document.getElementById("status");

  if (!query) {
    showDefault();
    return;
  }

  const tokens = query.split(/[\s,.\/·~!?]+/).filter(Boolean);
  const highlightMap = new Map();

  const scored = IDIOMS.map(idiom => {
    const { score, matched } = scoreIdiom(idiom, query, tokens);
    if (score > 0) highlightMap.set(idiom, matched);
    return { idiom, score };
  })
  .filter(entry => entry.score > 0)
  .sort((a, b) => b.score - a.score)
  .slice(0, 12)
  .map(entry => entry.idiom);

  statusEl.textContent = scored.length
    ? `"${query}"에 어울리는 사자성어 ${scored.length}개를 찾았어요`
    : `"${query}"에 어울리는 사자성어를 찾지 못했어요`;

  renderCards(scored, highlightMap);
}

document.getElementById("query").addEventListener("keydown", e => {
  if (e.key === "Enter") runSearch();
});

showDefault();
</script>
